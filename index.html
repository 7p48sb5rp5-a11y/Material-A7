<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRE Material Check</title>
<style>
:root{--p:#0b5ed7;--ok:#198754;--bad:#dc3545;--bg:#f4f6f8}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#222}
header{background:#123047;color:#fff;padding:18px;text-align:center} main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:10px;padding:14px 16px;font-size:16px;margin:5px 0;width:100%;cursor:pointer;background:var(--p);color:#fff}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.gray{background:#6c757d}
input,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;margin:6px 0 12px;font-size:16px}
label{font-weight:bold}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.status-ok{color:var(--ok);font-weight:bold}.status-bad{color:var(--bad);font-weight:bold}
#reader{width:100%;overflow:hidden;border-radius:10px}
.small{font-size:13px;color:#666}.qrbox{text-align:center;padding:12px}
</style>
</head>
<body>
<header><h1>🧰 SRE Material Check</h1><div>QR-Code • Prüfung • PDF</div></header>
<main>
<section id="home">
<div class="card">
<button onclick="show('scan')">📷 Material per QR-Code scannen</button>
<button onclick="show('newMaterial')">➕ Neues Material anlegen</button>
<button onclick="showMaterials()">📋 Materialübersicht</button>
<button class="gray" onclick="showChecks()">📝 Aktuelle Prüfliste</button>
<button class="ok" onclick="createPDF()">📄 Prüfprotokoll als PDF erstellen</button>
</div>
<div class="card"><b>Gespeicherte Materialien:</b> <span id="count"></span><br>
<b>Aktuelle Prüfungen:</b> <span id="checkCount"></span></div>
</section>

<section id="newMaterial" class="hidden">
<div class="card"><h2>➕ Neues Material</h2>
<label>Bezeichnung</label><input id="name" placeholder="z.B. ARGUS">
<label>Seriennummer</label><input id="serial" placeholder="z.B. 11">
<label>Nächste DGUV3-Prüfung</label><input id="dguv" type="date">
<button onclick="addMaterial()">💾 Material speichern & QR-Code erstellen</button>
<button class="gray" onclick="show('home')">← Zurück</button>
</div>
<div id="newQR" class="card qrbox hidden"></div>
</section>

<section id="scan" class="hidden">
<div class="card"><h2>📷 QR-Code scannen</h2>
<div id="reader"></div>
<div class="small">Kamera-Zugriff erlauben und QR-Code auf dem Material scannen.</div>
<button class="gray" onclick="stopScanner();show('home')">← Zurück</button></div>
</section>

<section id="material" class="hidden">
<div class="card"><h2 id="matTitle">Material</h2>
<p><b>Seriennummer:</b> <span id="matSerial"></span></p>
<p><b>Nächste DGUV3:</b> <span id="matDGUV"></span></p>
<label>Prüfung</label>
<div class="row"><button class="ok" onclick="setCheck('In Ordnung','Einsatzfähig')">✓ In Ordnung / Einsatzfähig</button>
<button class="bad" onclick="setCheck('Mangel','Nicht einsatzfähig')">⚠ Mangel / Nicht einsatzfähig</button></div>
<label>Bemerkung</label><textarea id="note" placeholder="Optional: Mangel oder Bemerkung"></textarea>
<button onclick="saveCheck()">💾 Prüfung speichern</button>
<button class="gray" onclick="show('home')">Abbrechen</button>
</div>
</section>

<section id="materials" class="hidden"><div class="card"><h2>📋 Materialübersicht</h2><div id="materialsList"></div><button class="gray" onclick="show('home')">← Zurück</button></div></section>
<section id="checks" class="hidden"><div class="card"><h2>📝 Aktuelle Prüfliste</h2><div id="checksList"></div><button class="ok" onclick="createPDF()">📄 PDF erstellen</button><button class="gray" onclick="show('home')">← Zurück</button></div></section>
</main>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let materials=JSON.parse(localStorage.getItem('sre_materials')||'[]');
let checks=JSON.parse(localStorage.getItem('sre_checks')||'[]');
let current=null, selectedCheck=null, scanner=null;

function seed(){
 if(!materials.length){
  materials.push({id:'SRE-0001',name:'ARGUS',serial:'11',dguv:'2026-10-11'});
  persist();
 }
}
function persist(){localStorage.setItem('sre_materials',JSON.stringify(materials));localStorage.setItem('sre_checks',JSON.stringify(checks));updateCounts()}
function updateCounts(){document.getElementById('count').textContent=materials.length;document.getElementById('checkCount').textContent=checks.length}
function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id!=='scan')stopScanner()}
function addMaterial(){
 let name=document.getElementById('name').value.trim(),serial=document.getElementById('serial').value.trim(),dguv=document.getElementById('dguv').value;
 if(!name||!serial){alert('Bitte Bezeichnung und Seriennummer eingeben.');return}
 let id='SRE-'+String(materials.length+1).padStart(4,'0');
 materials.push({id,name,serial,dguv});persist();
 document.getElementById('newQR').classList.remove('hidden');
 document.getElementById('newQR').innerHTML='<h3>QR-Code für '+name+'</h3><p><b>'+id+'</b></p><div id="qrcode"></div><p class="small">Screenshot machen oder ausdrucken und auf das Material kleben.</p>';
 new QRCode(document.getElementById('qrcode'),{text:id,width:220,height:220});
 document.getElementById('name').value='';document.getElementById('serial').value='';document.getElementById('dguv').value='';
}
function startScanner(){
 show('scan'); setTimeout(()=>{
 scanner=new Html5Qrcode('reader');
 scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>{stopScanner();openMaterial(txt)},()=>{}).catch(e=>alert('Kamera konnte nicht gestartet werden: '+e));
 },150)
}
function stopScanner(){if(scanner){scanner.stop().catch(()=>{});scanner=null;document.getElementById('reader').innerHTML=''}}
function openMaterial(id){
 current=materials.find(m=>m.id===id);
 if(!current){alert('Material '+id+' wurde nicht gefunden.');show('home');return}
 document.getElementById('matTitle').textContent='🧰 '+current.name;
 document.getElementById('matSerial').textContent=current.serial;
 document.getElementById('matDGUV').textContent=current.dguv?new Date(current.dguv).toLocaleDateString('de-DE'):'Nicht eingetragen';
 document.getElementById('note').value='';selectedCheck=null;show('material');
}
function setCheck(pruefung,status){selectedCheck={pruefung,status};alert('Ausgewählt: '+status)}
function saveCheck(){
 if(!selectedCheck){alert('Bitte Prüfung/Status auswählen.');return}
 checks.push({date:new Date().toLocaleString('de-DE'),materialId:current.id,name:current.name,serial:current.serial,...selectedCheck,note:document.getElementById('note').value});
 persist();alert('Prüfung gespeichert.');show('home');
}
function showMaterials(){
 let h='<table><tr><th>ID</th><th>Material</th><th>SN</th><th>DGUV3</th></tr>';
 materials.forEach(m=>h+=`<tr><td>${m.id}</td><td>${m.name}</td><td>${m.serial}</td><td>${m.dguv||'-'}</td></tr>`);
 document.getElementById('materialsList').innerHTML=h+'</table>';show('materials')
}
function showChecks(){
 let h='<table><tr><th>Material</th><th>Prüfung</th><th>Status</th></tr>';
 checks.forEach(c=>h+=`<tr><td>${c.name}<br><small>${c.serial}</small></td><td>${c.pruefung}</td><td class="${c.status==='Einsatzfähig'?'status-ok':'status-bad'}">${c.status}</td></tr>`);
 document.getElementById('checksList').innerHTML=h+'</table>';show('checks')
}
function createPDF(){
 if(!checks.length){alert('Noch keine Prüfungen vorhanden.');return}
 const {jsPDF}=window.jspdf,doc=new jsPDF();let y=20;
 doc.setFontSize(18);doc.text('SRE MATERIAL-PRÜFPROTOKOLL',20,y);y+=12;
 doc.setFontSize(11);doc.text('Erstellt: '+new Date().toLocaleString('de-DE'),20,y);y+=12;
 checks.forEach((c,i)=>{if(y>260){doc.addPage();y=20}doc.setFontSize(13);doc.text((i+1)+'. '+c.name,20,y);y+=7;doc.setFontSize(10);
 doc.text('Seriennummer: '+c.serial,25,y);y+=6;doc.text('Prüfung: '+c.pruefung,25,y);y+=6;doc.text('Status: '+c.status,25,y);y+=6;
 if(c.note){doc.text('Bemerkung: '+c.note,25,y);y+=6}doc.text('Datum: '+c.date,25,y);y+=10;
 });
 doc.save('SRE-Pruefprotokoll.pdf');
}
seed();updateCounts();
// Override scan button behavior
document.querySelector('#home button').onclick=startScanner;
</script>
</body>
</html>
